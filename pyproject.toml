[project]
name = "generals-zero"
version = "1.0.0"
description = "Self-play reinforcement learning for generals.io: a ViT policy trained end-to-end on GPU in JAX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "jax",          # training
    "optax",
    "numpy",
    "torch",        # CPU deployment twin and latency measurement
    "pandas",       # replay manifests
    "pyarrow",
    "zstandard",    # replay fetching
]

[project.optional-dependencies]
dev = ["pytest"]
wandb = ["wandb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
